version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: diaspora-concierge_backend_1
      APP_PORT: 4000
      # The backend enforces its own JWT auth, and PayPal / Paynow webhooks plus the
      # mobile apps cannot pass Umbrel's auth wall — so the proxy must not add one.
      PROXY_AUTH_ADD: "false"

  backend:
    image: ghcr.io/nomadicco0-star/diaspora-concierge-backend:1.1.5
    restart: unless-stopped
    stop_grace_period: 1m
    # Runs as root: Docker creates the bind-mount directories below as root:root on first mount,
    # and the app creates working subdirectories inside them at runtime (the Hypercore proof-log
    # and chat stores, the OCR temp dir). Running rootless there means EACCES on the first write.
    # The container is isolated; this matches how the other apps on this Umbrel run.
    user: "0:0"
    # migrate deploy is idempotent and re-run on every start; if Postgres isn't ready
    # yet the container exits non-zero and the restart policy brings it straight back,
    # so no explicit depends_on ordering is needed (and none can deadlock).
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: "postgresql://diaspora:${APP_SEED}@diaspora-concierge_postgres_1:5432/diaspora_concierge"
      # Umbrel derives APP_SEED / APP_PASSWORD deterministically per app — long, stable
      # across restarts and reinstalls, never in source control.
      JWT_SECRET: ${APP_SEED}
      # The admin account is bootstrapped on first start with NO config edit needed:
      # username below, password = the app password Umbrel shows on this app's page
      # (deterministicPassword). Change it afterwards from the admin panel.
      ADMIN_EMAIL: admin@diasporaconcierge.app
      ADMIN_BOOTSTRAP_PASSWORD: ${APP_PASSWORD}
      # Set here rather than left to backend.env: this value isn't a secret, and the Umbrel
      # Files app's editor has proven unreliably automatable to drive via browser automation —
      # no reason a non-secret has to live in the user-editable file at all. Docker Compose's
      # `environment:` always wins over `env_file:` for the same key, so this takes effect
      # regardless of what backend.env still has on this line.
      #
      # Two live-tested attempts before this one both failed: the bare container name
      # (http://btcpay-server_web_1 — a different community app's own compose project, on its
      # own default Docker network by default, doesn't resolve: "fetch failed") and the host's
      # LAN IP (http://192.168.1.40:3003 — confirmed via the container's own error: "connect
      # ENETUNREACH 192.168.1.40:3003", a routing failure — an app container has no route to
      # the LAN by default, only to the internet via NAT and to its own compose project's other
      # containers). Umbrel's own app_proxy demonstrably *does* resolve `btcpay-server_web_1`
      # (see BTCPay's own docker-compose.yml: its app_proxy is configured with exactly that
      # APP_HOST) — the `networks:` block below joins this service to the same shared network
      # Umbrel's app_proxy/tunnel containers use, on the theory that's what makes cross-app
      # container-name resolution work, rather than every app container getting it by default.
      BTCPAY_URL: http://btcpay-server_web_1:3003
    networks:
      - default
      - umbrel_main_network
    env_file:
      # Ships with the app (all blank) and is copied to the app data dir on install. Only needed
      # to connect payment providers — the app runs and the admin panel works on your LAN without
      # touching it. Public internet access is handled by the separate "Cloudflare Tunnel"
      # Umbrel app pointed at diaspora-concierge_backend_1:4000.
      - ${APP_DATA_DIR}/backend.env
    volumes:
      - ${APP_DATA_DIR}/uploads:/app/uploads
      - ${APP_DATA_DIR}/uploads-kyc:/app/uploads-kyc
      - ${APP_DATA_DIR}/uploads-ocr-tmp:/app/uploads-ocr-tmp
      - ${APP_DATA_DIR}/hypercore-storage:/app/hypercore-storage
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: diaspora
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: diaspora_concierge
      # Page-level checksums so silent disk corruption is detected on read rather than
      # served as good data — worth the tiny overhead for financial records.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diaspora -d diaspora_concierge"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-backup:
    # Belt-and-braces on top of Umbrel's own system Backups (which already sweep this whole app
    # data directory): a daily pg_dump in Postgres's native custom format, 14 kept, written under
    # the app data dir so Umbrel Backups pick them up too. A dump restores cleanly even if a
    # file-level copy of the live data directory were ever torn.
    image: postgres:16-alpine
    restart: unless-stopped
    user: "0:0"
    environment:
      PGPASSWORD: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        echo "db-backup: daily pg_dump to /backups, keeping 14"
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          if pg_dump -h diaspora-concierge_postgres_1 -U diaspora -d diaspora_concierge -Fc -f "/backups/db_$$ts.dump"; then
            echo "db-backup: wrote db_$$ts.dump"
            ls -1t /backups/db_*.dump 2>/dev/null | tail -n +15 | xargs -r rm --
          else
            echo "db-backup: pg_dump FAILED at $$ts"
          fi
          sleep 86400
        done

networks:
  # Umbrel's own shared network, joined explicitly so the backend can resolve other community
  # apps' containers by name (see the BTCPAY_URL comment above) — `default` (this project's own
  # auto-created network) is kept too, since postgres/db-backup are only reachable there.
  # `external: true` because Umbrel creates this network itself; a plain declaration here
  # would try to create a second network with the same name and fail.
  umbrel_main_network:
    external: true
