releaseNotes: >-
  1.1.7 — admin two-factor authentication. The admin account is the most powerful credential on
  the platform (approves KYC, resolves disputes, triggers payouts) and was the one account type
  with no second factor. Enable it from the admin panel's new "Two-factor authentication" section
  — scan the code into any authenticator app (Google Authenticator, Authy, 1Password, etc.).
  Losing your device? "Forgot password" with your recovery code clears two-factor too, so you're
  never locked out. Real image rebuild.


  1.1.6 — security hardening: rate limits added on payment webhooks, admin routes, and KYC
  submission (previously uncapped). JWTs now have real server-side revocation — a password or
  recovery-code reset invalidates every token issued before it, immediately, instead of waiting
  out the 7-day expiry. New tokenVersion column on user/runner/admin accounts (applied
  automatically on startup, no manual DB step needed). Real image rebuild.


  1.1.5 — security fix: multer (file uploads — KYC docs, proof photos, receipts all go through
  it) had an unauthenticated remote DoS, patchable by anyone with a single crafted upload request
  (CVE-2026-77078, high severity, fixed upstream in 2.3.0). Bumped to 2.4.0. Also forces qs (a
  transitive dependency of express) to 6.16.0, closing a lower-severity array-limit bypass
  (CVE-2026-82562). Real image rebuild — dependency versions changed.


  1.1.4 — fixes the BTCPay checkout link itself: invoice creation started working in 1.1.3, but
  the returned checkout link used BTCPay's own internal Docker hostname, which a client's phone
  can never open. Now rewritten to a LAN-reachable address before it's returned. Real image
  rebuild this time (source code changed, not just compose config).


  1.1.3 — second attempt at the BTCPay connectivity fix: 1.1.2's LAN-IP address turned out
  unreachable too (containers have no route to the LAN by default, confirmed via "connect
  ENETUNREACH"). This version instead joins the backend to Umbrel's own shared Docker network
  and reverts BTCPAY_URL to the internal container name, matching how Umbrel's own app_proxy
  reaches BTCPay. Still no image rebuild — same 1.1.1 image, config-only change.


  1.1.2 — fixes BTCPay invoice creation ("fetch failed"): BTCPAY_URL now points at the host's LAN
  address instead of an internal Docker hostname that doesn't resolve across separate Umbrel
  apps' networks. No image rebuild — same 1.1.1 image, just a corrected compose config, which
  this version bump forces Umbrel to actually apply (see the 1.1.1 note below on why a plain
  restart doesn't).


  1.1.1 — no functional change; a version bump to force Docker to recreate the backend container
  so it actually re-reads backend.env (a plain restart/stop-start reuses the existing container
  and its environment from when it was first created, so backend.env edits since then were never
  picked up). If you've edited backend.env before, update to this version and the new values will
  finally take effect.


  1.1.0 — fixes task creation (the proof-log storage wasn't writable) and the platform commission
  reading as 0% from a blank config line. The image is small (the on-device AI model runtimes are
  optional and left out), the admin account bootstraps automatically, and all data lives under the
  app data directory so Umbrel's own Backups cover it. Public internet access is via the separate
  Cloudflare Tunnel app.
dependencies: []
path: "/admin"
defaultUsername: "admin@diasporaconcierge.app"
