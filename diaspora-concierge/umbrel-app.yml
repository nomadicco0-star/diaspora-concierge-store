releaseNotes: >-
  1.1.3 — second attempt at the BTCPay connectivity fix: 1.1.2's LAN-IP address turned out
  unreachable too (containers have no route to the LAN by default, confirmed via "connect
  ENETUNREACH"). This version instead joins the backend to Umbrel's own shared Docker network
  and reverts BTCPAY_URL to the internal container name, matching how Umbrel's own app_proxy
  reaches BTCPay. Still no image rebuild — same 1.1.1 image, config-only change.


  1.1.2 — fixes BTCPay invoice creation ("fetch failed"): BTCPAY_URL now points at the host's LAN
  address instead of an internal Docker hostname that doesn't resolve across separate Umbrel
  apps' networks. No image rebuild — same 1.1.1 image, just a corrected compose config, which
  this version bump forces Umbrel to actually apply (see the 1.1.1 note below on why a plain
  restart doesn't).


  1.1.1 — no functional change; a version bump to force Docker to recreate the backend container
  so it actually re-reads backend.env (a plain restart/stop-start reuses the existing container
  and its environment from when it was first created, so backend.env edits since then were never
  picked up). If you've edited backend.env before, update to this version and the new values will
  finally take effect.


  1.1.0 — fixes task creation (the proof-log storage wasn't writable) and the platform commission
  reading as 0% from a blank config line. The image is small (the on-device AI model runtimes are
  optional and left out), the admin account bootstraps automatically, and all data lives under the
  app data directory so Umbrel's own Backups cover it. Public internet access is via the separate
  Cloudflare Tunnel app.
dependencies: []
path: "/admin"
defaultUsername: "admin@diasporaconcierge.app"
deterministicPassword: true
